<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova Aba</title>
  <link rel="icon" href="misc/icon-page.ico" type="image/x-icon" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/componentes.css" />

  <!-- jQuery (necessário pro Chessboard) -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <link rel="stylesheet" href="js/libs/chessboard.min.css" />
  <script src="js/libs/chessboard.min.js"></script>
</head>
<body>
  <div class="pagina">
    <header class="hero">
      <p class="saudacao" id="saudacao"></p>
      <h1 class="hora" id="horaAtual"></h1>
      <p class="data" id="dataAtual"></p>

      <div class="busca">
        <svg class="busca-icone" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" id="searchInput" placeholder="Pesquisar no Google..." autocomplete="off" autofocus />
        <kbd>/</kbd>
      </div>
    </header>

    <main class="grid-principal">
      <section class="coluna-esquerda">
        <div class="destaques" id="destaques"></div>
        <div id="grupos"></div>
      </section>

      <aside class="coluna-direita">
        <section class="card painel-metas">
          <h2>Metas</h2>
          <div id="lista-metas"></div>
          <div class="nova-meta">
            <input type="text" id="nomeMeta" placeholder="Nome da meta" />
            <input type="number" id="valorMaximo" placeholder="Total" min="1" />
            <button id="btnAddMeta" class="btn-add" aria-label="Adicionar meta">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            </button>
          </div>
        </section>

        <section class="card bloco-notas">
          <h2>Notas</h2>
          <textarea id="bloco-textarea" placeholder="Escreva suas anotações aqui..."></textarea>
        </section>

        <section class="card bloco-xadrez">
          <h2>Tabuleiro</h2>
          <div id="chessboard"></div>
          <div class="acoes-xadrez">
            <button id="btnReiniciar" class="btn-ghost">Reiniciar</button>
            <button id="btnVirar" class="btn-ghost">Virar</button>
          </div>
        </section>
      </aside>
    </main>

    <footer class="rodape">Feito com fé e café por Jacob ✝️</footer>
  </div>

  <script src="js/links.js"></script>
  <script src="js/relogio.js"></script>
  <script src="js/pesquisa.js"></script>
  <script src="js/notas.js"></script>
  <script src="js/metas.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
